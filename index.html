<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food Recipe App</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dark text-white">

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-black px-3">
    <h3 class="text-info">🍽 Food Recipe</h3>

    <form class="d-flex">
      <input class="form-control me-2 searchbox" type="search" placeholder="Search recipes...">
      <button class="btn btn-info text-white">Search</button>
    </form>
  </nav>

  <!-- MAIN -->
  <div class="container mt-4">
    <h2 class="text-center mb-4 text-info">Explore Recipes</h2>

    <div class="row Listofdish g-4"></div>
  </div>

  <!-- MODAL -->
  <div class="modal fade" id="recipeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-dark text-white">

        <div class="modal-header">
          <h5 class="modal-title">Recipe</h5>
          <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body" style="max-height:70vh; overflow-y:auto;">
          <div class="IngredentList"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
